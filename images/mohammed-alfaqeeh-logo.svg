<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #aabcb2; }
      .bracket { fill: none; stroke: #cc8b65; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .monogram { fill: #f4f6f5; }
      .slash { stroke: #b5bcba; stroke-width: 14; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background circle using the accent-light color -->
  <circle class="bg" cx="256" cy="256" r="256"/>

  <!-- Left angle bracket < -->
  <polyline class="bracket" points="196,166 126,256 196,346" />

  <!-- Right angle bracket > -->
  <polyline class="bracket" points="316,166 386,256 316,346" />

  <!-- Slash accent between brackets, nodding to closing tags -->
  <line class="slash" x1="270" y1="186" x2="242" y2="326" />

  <!-- Monogram M nested in the center -->
  <g transform="translate(256,256)">
    <path class="monogram" d="
      M -44,42
      L -44,-30
      L -22,-30
      L 0,4
      L 22,-30
      L 44,-30
      L 44,42
      L 28,42
      L 28,-6
      L 4,30
      L -4,30
      L -28,-6
      L -28,42
      Z" />
  </g>
</svg>
